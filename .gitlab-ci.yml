stages:
  - build
  - test
  - compare

variables:
  LCG: "LCG_108/x86_64-el9-gcc14-opt"
  CCACHE_DIR: ${CI_PROJECT_DIR}/ccache
  CCACHE_MAXSIZE: 2G
  NEVENTS: 10
  NEVENTS_PBPB: 5
  DEFAULT_GEOMETRIES: >-
    geometry_2026_06_10_segmented_withRICH_noEndcapTOFs
    geometry_2026_06_10_segmented_withoutRICH_noEndcapTOFs
  #CCACHE_KEY_SUFFIX: r2
  ALIBUILD_JOBS: "8"

default:
  # Use CERN-supported container with LCG/CVMFS access
  image: gitlab-registry.cern.ch/acts/acts-athena-ci/alma9-atlasos-dev:v2
  cache:
    - key: ccache-${CI_JOB_NAME}-${CI_COMMIT_REF_SLUG}
      fallback_keys:
        - ccache-${CI_JOB_NAME}-main
      when: always
      paths:
        - ${CCACHE_DIR}
  #image: gitlab-registry.cern.ch/linuxsupport/alma9-base:latest
  before_script:
    - echo "Container ready, build tools available"
    - dnf install -y --disablerepo="tdaq*" motif motif-devel
    - export LD_LIBRARY_PATH=/usr/lib64:$LD_LIBRARY_PATH

# -----------------------
# BUILD ACTS
# -----------------------
build_acts:
  stage: build
  tags:
    - cvmfs
  script:
    - echo "::group::Setup LCG"
    - ls /cvmfs/
    - source /cvmfs/sft.cern.ch/lcg/views/${LCG}/setup.sh

    - echo "::group::Checkout ACTS"
    # upstream ACTS main, pinned to the commit actso2 was validated against
    # (outputs bit-identical to tdr-branch for pp + 30 PU)
    #- git clone https://github.com/pbutti/acts.git -b tdr-branch
    #- git clone https://github.com/acts-project/acts.git && git -C acts checkout 458e2ca5d
    - git clone https://github.com/acts-project/acts.git
    
    
    - echo "::group::Configure ACTS"
    - rm -rf acts/build
    - cmake -S acts -B acts/build -DACTS_BUILD_ALIGNMENT=ON -DACTS_BUILD_PLUGIN_GEANT4=on -DACTS_BUILD_PLUGIN_JSON=on -DACTS_BUILD_PLUGIN_ROOT=on -DACTS_BUILD_EXAMPLES_ROOT=on -DACTS_BUILD_FATRAS=on -DACTS_BUILD_FATRAS_GEANT4=on -DACTS_BUILD_EXAMPLES_GEANT4=on -DACTS_BUILD_PYTHON_BINDINGS=on -DACTS_BUILD_ANALYSIS_APPS=on -DCMAKE_CXX_COMPILER_LAUNCHER=ccache -DACTS_BUILD_EXAMPLES_PYTHIA8=on -DCMAKE_CXX_COMPILER_LAUNCHER=ccache -DCMAKE_INSTALL_PREFIX=$CI_PROJECT_DIR/acts/install

    - echo "::group::Build ACTS"
    - ccache -z
    - cmake --build acts/build --target install -j$(nproc)
    - ccache -s
    - echo "::group::ACTS_SOURCE_DIR=${ACTS_SOURCE_DIR}"
  artifacts:
    paths:
      - acts/install
      - acts/Examples/Algorithms/Digitization/include
      - acts/Examples/Algorithms/TrackFinding/include
      - acts/Examples/Detectors/Common/include
    expire_in: 1 day

# -----------------------
# TEST TEMPLATE
# -----------------------
.test_template:
  stage: test
  tags:
    - cvmfs
  needs:
    - job: build_acts
      artifacts: true
  before_script:
    - echo "::group::Install runtime dependencies"
    - dnf install -y motif motif-devel
    - echo "::group::Setup LCG"
    - source /cvmfs/sft.cern.ch/lcg/views/${LCG}/setup.sh

    - echo "::group::Setup ACTS"
    - source acts/install/bin/this_acts.sh
    - export ACTS_SEQUENCER_DISABLE_FPEMON=1

    - echo "::group::Build project"
    - source setup.sh
    - mkdir -p build && cd build
    - cmake -DCMAKE_PREFIX_PATH=${PWD}/../acts/install ..
    - make -j2
    - cd ..

# -----------------------
# TEST JOBS
# -----------------------
test_alice3_default_geometries:
  extends: .test_template
  parallel:
    matrix:
      - GEOMETRY:
          - geometry_2026_06_10_segmented_withRICH_noEndcapTOFs
          - geometry_2026_06_10_segmented_withoutRICH_noEndcapTOFs
  script:
    - echo "::group::Running Alice3 full chain test for $GEOMETRY"
    - ldd acts/install/python/acts/examples/ActsExamplesPythonBindings*.so | grep Xm
    - | # needed to avoid \ cutting the command and thus missing the full output path argument
      python CI/scripts/full_chain_wrapper.py -g "$GEOMETRY" -n $NEVENTS --nThreads 1 --config job_configs/pp_gen3.py \
        --full_output_path monitoring_output_$GEOMETRY
  artifacts:
    paths:
      - output/monitoring_output_$GEOMETRY
    expire_in: 10 days


# check all geometries that have been added or modified in the merge request
# 1. check all Added or Modified geos
# 2. remove any geos that are listed as default geos (already ran over)
# 3. run the test for the remaining geos
test_alice3_geometry_changes:
  extends: .test_template
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - "geometries/**/*"
  script:
    - echo "::group::Running Alice3 geometry changes test"
    - ldd acts/install/python/acts/examples/ActsExamplesPythonBindings*.so | grep Xm
    - | # check Added and Modified geometries: needs to be top level geometries dir
      AFFECTED_DIRS=$(git diff --name-only --diff-filter=AM ${CI_MERGE_REQUEST_DIFF_BASE_SHA} -- geometries/ \
        | awk -F/ '{print $2}' | sort -u)

      TO_TEST=""
      for DIR in $AFFECTED_DIRS; do
        if echo "$DEFAULT_GEOMETRIES" | grep -qw "$DIR"; then
          echo "Skipping $DIR (already covered by default geometry run)"
        elif [ ! -d "geometries/$DIR/geom" ]; then
          echo "Skipping $DIR (not a geometry: no geom/ subdirectory)"
        else
          TO_TEST="$TO_TEST $DIR"
        fi
      done

      if [ -z "$TO_TEST" ]; then
        echo "No geometry directories to test beyond defaults, skipping"
        touch $CI_PROJECT_DIR/to_test_geometries.txt  # empty marker so the compare job can detect "nothing to do"
        exit 0
      fi

      echo "$TO_TEST" > $CI_PROJECT_DIR/to_test_geometries.txt

      for GEOMETRY in $TO_TEST; do
        echo "::group::Testing geometry: $GEOMETRY"
        python CI/scripts/full_chain_wrapper.py -g "$GEOMETRY" -n $NEVENTS --nThreads 1 --config job_configs/pp_gen3.py \
          --full_output_path monitoring_output_$GEOMETRY
      done
  artifacts:
    paths:
      - output/monitoring_output_*
      - to_test_geometries.txt
    expire_in: 10 days


