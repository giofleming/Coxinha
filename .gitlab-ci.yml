test_alice3_lut_creation:
  extends: .test_template
  parallel:
    matrix:
      - GEOMETRY:
          - geometry_2026_06_10_segmented_withoutRICH_noEndcapTOFs
  script:
    - echo "::group::Running Alice3 LUT creation test for $GEOMETRY"
    - ldd acts/install/python/acts/examples/ActsExamplesPythonBindings*.so | grep Xm
    - | # needed to avoid \ cutting the command and thus missing the full output path argument
      python CI/scripts/full_chain_wrapper.py -g "$GEOMETRY" -n 100 --nThreads 1 --enable-lut --config job_configs/gun_Pions.py\
        --full_output_path monitoring_output_lut_$GEOMETRY
  artifacts:
    paths:
      - output/monitoring_output_lut_$GEOMETRY
    expire_in: 1 days


# ------------------------
# COMPARE OUTPUTS 
# ------------------------

compare_alice3_default_geometries:
  stage: compare
  tags:
    - cvmfs
  needs:
    - job: test_alice3_default_geometries
      artifacts: true
  parallel:
    matrix:
      - GEOMETRY:
          - geometry_2026_06_10_segmented_withRICH_noEndcapTOFs
          - geometry_2026_06_10_segmented_withoutRICH_noEndcapTOFs
  before_script:
    # To get root and everything else
    - dnf install -y poppler-utils
    - source /cvmfs/sft.cern.ch/lcg/views/${LCG}/setup.sh
    - git clone https://gitlab-ci-token:${CI_JOB_TOKEN}@gitlab.cern.ch/pibutti/indetmplib.git
    - source indetmplib/setup_python.sh
  script:
    - echo "::group::Comparing monitoring output of default geometries to reference"
    - >-
      python indetmplib/alice3/performance/plots/compare_monitoring.py 
      --reference $CI_PROJECT_DIR/reference_files/pp_30pu/ 
      --candidate $CI_PROJECT_DIR/output/monitoring_output_$GEOMETRY/
      --output_dir comparison_output/$GEOMETRY
    - python CI/scripts/generate_index.py --output-dir comparison_output/$GEOMETRY --title test --convert-to-png
  artifacts:
    paths:
      - comparison_output/
    expire_in: 10 days
    when: always

compare_alice3_PbPbCentral:
  stage: compare
  tags:
    - cvmfs
  needs:
    - job: test_alice3_PbPbCentral
      artifacts: true
  parallel:
    matrix:
      - GEOMETRY:
          - geometry_2026_06_10_segmented_withoutRICH_noEndcapTOFs
  before_script:
    # To get root and everything else
    - dnf install -y poppler-utils
    - source /cvmfs/sft.cern.ch/lcg/views/${LCG}/setup.sh
    - git clone https://gitlab-ci-token:${CI_JOB_TOKEN}@gitlab.cern.ch/pibutti/indetmplib.git
    - source indetmplib/setup_python.sh
  script:
    - echo "::group::Comparing monitoring output of default geometries to reference"
    - >-
      python indetmplib/alice3/performance/plots/compare_monitoring.py
      --reference $CI_PROJECT_DIR/reference_files/PbPbCentral/
      --candidate $CI_PROJECT_DIR/output/monitoring_output_PbPbCentral_$GEOMETRY
      --output_dir comparison_output_PbPbCentral/PbPbCentral_$GEOMETRY
    - python CI/scripts/generate_index.py --output-dir comparison_output_PbPbCentral/PbPbCentral_$GEOMETRY --title test --convert-to-png
  artifacts:
    paths:
      - comparison_output_PbPbCentral/
    expire_in: 10 days
    when: always


compare_alice3_geometry_changes:
  stage: compare
  tags:
    - cvmfs
  rules:
  - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    changes:
      - "geometries/**/*"
  needs:
    - job: test_alice3_geometry_changes
      artifacts: true
  before_script:
    # To get root and everything else
    - dnf install -y poppler-utils
    - source /cvmfs/sft.cern.ch/lcg/views/${LCG}/setup.sh
    - git clone https://gitlab-ci-token:${CI_JOB_TOKEN}@gitlab.cern.ch/pibutti/indetmplib.git
    - source indetmplib/setup_python.sh
  script:
    - echo "::group::Comparing monitoring output of changed geometries to reference"
    - |
      if [ ! -s $CI_PROJECT_DIR/to_test_geometries.txt ]; then
        echo "No changed geometries to compare (nothing beyond defaults) — skipping."
        exit 0
      fi
      for GEOMETRY in $(cat $CI_PROJECT_DIR/to_test_geometries.txt); do
        echo "::group::Comparing $GEOMETRY"
        python indetmplib/alice3/performance/plots/compare_monitoring.py \
          --reference $CI_PROJECT_DIR/reference_files/pp_30pu/ \
          --candidate $CI_PROJECT_DIR/output/monitoring_output_$GEOMETRY/ \
          --output_dir comparison_output/$GEOMETRY
        python CI/scripts/generate_index.py --output-dir comparison_output/$GEOMETRY --title test --convert-to-png
      done
  artifacts:
    paths:
      - comparison_output/
    expire_in: 10 days
    when: always

# ------------------------
# PAGES
# ------------------------

pages:
  stage: compare
  tags:
    - cvmfs
  needs:
  - job: compare_alice3_default_geometries
    artifacts: true
  - job: compare_alice3_PbPbCentral
    artifacts: true
  - job: compare_alice3_geometry_changes
    artifacts: true
    optional: true
  script:
    - mkdir -p public
    - cp -r comparison_output/* public/
    - cp -r comparison_output_PbPbCentral/* public/
  artifacts:
    paths:
    - public
  environment:
    #name: pages/$CI_COMMIT_REF_SLUG
    #url: https://$CI_PROJECT_ROOT_NAMESPACE.gitlab.io/-/$CI_PROJECT_NAME/-/jobs/$CI_JOB_ID/artifacts/public/index.html
    name: pages/$CI_COMMIT_REF_SLUG
    url: $CI_PAGES_URL
  rules:
    - if: $CI_PIPELINE_SOURCE == "web"
      when: always
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: always
    - if: $CI_MERGE_REQUEST_IID
      when: always


