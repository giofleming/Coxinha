# -----------------------
# PIPELINE RULES
# -----------------------
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_PIPELINE_SOURCE == "web"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"


format_check:
  stage: test
  image: python:3.11-slim
  # override default before_script/cache: they assume the Alma9/ccache build image, not this slim image
  before_script: []
  cache: []
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  script:
    - pip install autopep8
    - autopep8 --recursive --diff --exit-code --exclude acts .

# Build ACTSO2 with aliBuild in a separate job, so that we can use the artifacts in the test jobs
build_actso2_alibuild:
  stage: build

  image:
    name: gitlab-registry.cern.ch/linuxsupport/alma9-base:9
    pull_policy: if-not-present

  allow_failure: true

  cache: []

  before_script:
    - dnf install -y epel-release dnf-plugins-core
    - dnf config-manager --set-enabled crb
    - dnf group install -y "Development Tools"

    - |
      cat > /etc/yum.repos.d/alice-system-deps.repo <<'EOF'
      [alice-system-deps]
      name=alice-system-deps
      baseurl=https://s3.cern.ch/swift/v1/alibuild-repo/RPMS/o2-full-deps_el9.x86-64/
      enabled=1
      gpgcheck=0
      EOF

    - dnf install -y alice-o2-full-deps alibuild git

  script:
    - |
      export ALIBUILD_ROOT="/tmp/actso2-alibuild-${CI_JOB_ID}"

      rm -rf "${ALIBUILD_ROOT}"
      mkdir -p "${ALIBUILD_ROOT}"

      echo "::group::Prepare aliBuild workspace"

      # Only fetch recipes.
      cd "${ALIBUILD_ROOT}"
      aliBuild init HepMC3

      # Current MR checkout becomes the ACTSO2 source.
      ln -s "${CI_PROJECT_DIR}" "${ALIBUILD_ROOT}/ACTSO2"

      echo "ACTSO2 commit:"
      git -C ACTSO2 rev-parse HEAD

      echo "alidist commit:"
      git -C alidist rev-parse HEAD

      echo "::group::Build ACTSO2"

      aliBuild build ACTSO2 --jobs "${ALIBUILD_JOBS}" --remote-store https://s3.cern.ch/swift/v1/alibuild-repo
      BUILD_STATUS=$?

      if [ $BUILD_STATUS -ne 0 ]; then
          echo "aliBuild build failed with status ${BUILD_STATUS}"
          if [ -f "sw/BUILD/ACTSO2-latest/log" ]; then
              echo "Copying aliBuild log to GitLab artifacts"
              cp "sw/BUILD/ACTSO2-latest/log" "${CI_PROJECT_DIR}/ACTSO2-build.log"
              echo
              echo "================ LAST 200 LOG LINES ================"
              tail -n 200 "${CI_PROJECT_DIR}/ACTSO2-build.log"
              echo "====================================================="
          else
              echo "WARNING: aliBuild log not found"
          fi
      else
          echo "aliBuild build succeeded"
      fi

      exit "${BUILD_STATUS}"

  artifacts:
    when: always
    paths:
      - ACTSO2-build.log
    expire_in: 1 day

  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'