  extends: .test_template
  parallel:
    matrix:
      - GEOMETRY:
          - geometry_2026_06_10_segmented_withoutRICH_noEndcapTOFs
  script:
    - echo "::group::Running Alice3 full chain test on PbPbCentral for $GEOMETRY"
    - ldd acts/install/python/acts/examples/ActsExamplesPythonBindings*.so | grep Xm
    - | # needed to avoid \ cutting the command and thus missing the full output path argument
      python CI/scripts/full_chain_wrapper.py -g "$GEOMETRY" -n $NEVENTS_PBPB --nThreads 1 --config job_configs/PbPbCentral.py \
        --full_output_path monitoring_output_PbPbCentral_$GEOMETRY
  artifacts:
    paths:
      - output/monitoring_output_PbPbCentral_$GEOMETRY
    expire_in: 10 days


